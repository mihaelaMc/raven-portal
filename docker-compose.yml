services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (openssl rand -hex 64)}
      FRONTEND_ORIGIN: http://localhost:8080
      # Run Solid Queue inside Puma so audit-log and mailer jobs work in a single container.
      SOLID_QUEUE_IN_PUMA: "1"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # ActiveStorage uploads + the Solid trio's SQLite databases live here in production mode.
      - api_storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  api_storage:
