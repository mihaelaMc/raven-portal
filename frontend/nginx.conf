server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets can be cached forever; everything else falls back to
  # index.html so client-side routes (/dashboard, /profile) survive a reload.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
